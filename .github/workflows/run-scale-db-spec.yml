name: Script - Run scale-db-spec.sh
on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 赋予脚本执行权限
      - name: Add execute permission
        run: chmod +x ./scale-db-spec.sh

      # 运行脚本
      - name: Run scale-db-spec.sh
        run: bash ./scale-db-spec.sh
