name: TF - Deploy main.tf
# 手动触发
on:
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    steps:
      # Step1：检出整个仓库代码到runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step2：登录Azure，Terraform需要Azure凭证
      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step3：安装Terraform工具
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step4：进入main.tf所在目录
      - name: Terraform Init for main
        run: |
          cd terraform/main
          terraform init

      # Step5：执行部署 apply
      - name: Terraform Apply main resources
        run: |
          cd terraform/main
          terraform apply -auto-approve
